name: QA & CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Annuler les exécutions précédentes redondantes pour économiser le quota GitHub Actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job PHP : PHP 8.4, Composer Cache, PHPStan, PHPUnit, PHPCS
  # -------------------------------------------------------------
  php-qa:
    name: PHP Quality Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan (Level 7)
        run: composer lint:php

      - name: Run PHPUnit Tests
        run: composer test

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer lint

  # -------------------------------------------------------------
  # Job Frontend : Node 24 LTS, npm cache, typecheck, lint, build
  # -------------------------------------------------------------
  frontend-qa:
    name: Frontend Quality Assurance & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --prefer-offline --no-audit

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Lint JavaScript & TypeScript
        run: npm run lint:js

      - name: Production Build (CSS & JS)
        run: npm run build
